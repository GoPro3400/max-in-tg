name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The release workflow (image.yml) runs the tests first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No Puppeteer download: the browser tests (tests/browser) use the Chrome
      # the GitHub runner already has, and are skipped where there is none.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what package-lock.json
      # pins and fails loudly if the lockfile has drifted from package.json.
      # The Docker build uses `npm ci` too, so a PR that passes here cannot
      # break the image for a lockfile reason.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in $(find src tests -name '*.js'); do
            node --check "$f"
          done

      - name: Run tests
        run: npm test

      # The compose files are what people run. They must be valid, and must use
      # the image the release workflow publishes: a fork that publishes its own
      # has to change them, or its users would run this project's image.
      - name: Check the compose files
        run: |
          cp .env.example .env
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for file in docker-compose.yml docker-compose.prod.yml; do
            docker compose -f "$file" config --quiet
            if ! grep -q "image: $image:" "$file"; then
              echo "::error file=$file::$file does not use the image $image, which the release workflow publishes."
              exit 1
            fi
          done
