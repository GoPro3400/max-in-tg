services:
  max-in-tg:
    # As in docker-compose.yml: the ready image of a release, built here when
    # there is none to fetch.
    image: ghcr.io/gopro3400/max-in-tg:${MAX_IN_TG_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2048m
    read_only: true
    # Chromium runs with --disable-dev-shm-usage, so its shared memory lives
    # in /tmp, not /dev/shm (shm_size above is effectively unused), next to
    # Xvfb's files and ffmpeg's temp output — 256m left little headroom.
    tmpfs:
      - /tmp:size=1g,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
