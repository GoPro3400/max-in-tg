services:
  max-in-tg:
    # The ready image, made for every release: `docker compose pull` fetches it.
    # `build: .` makes the same image from this folder where there is none to
    # fetch (a fork, a commit that is not a release). MAX_IN_TG_VERSION in .env
    # picks the version: latest (the default), an exact one (0.2.0) or 0.2 for
    # the newest 0.2.x.
    image: ghcr.io/gopro3400/max-in-tg:${MAX_IN_TG_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Graceful shutdown drains in-flight browser work and closes Chromium
    # (index.js allows itself 25 s); Docker's default 10 s would SIGKILL first.
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    shm_size: 1gb
    # This is the file the installer runs, so the everyday deployment needs
    # these two here and not only in docker-compose.prod.yml.
    # Chromium's renderer grows over hours; without a ceiling it takes the
    # whole host down instead of just restarting itself.
    mem_limit: 2048m
    # Docker keeps container logs forever by default. This bridge is chatty and
    # long-lived, so an unbounded json-file log eventually fills the disk —
    # which on a small VPS takes the bridge with it.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
